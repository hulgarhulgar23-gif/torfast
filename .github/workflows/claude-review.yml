name: Claude Review (Fable)
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory reviewer: a failed review must not fail the run (no red X, no failure mail).
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          track_progress: true
          settings: |
            {
              "env": {
                "CLAUDE_CODE_USE_FOUNDRY": "1",
                "ANTHROPIC_FOUNDRY_RESOURCE": "elon-gpt55-eus2-0713",
                "ANTHROPIC_FOUNDRY_API_KEY": "${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}"
              }
            }
          claude_args: |
            --model claude-fable-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the working directory.
            Focus on real bugs, security issues, and risky behavior changes. Skip style
            nits and praise. Verify each suspicion against the actual code before
            reporting it.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            for line-specific findings. Keep the summary short; if nothing is wrong, say so
            in one sentence.
